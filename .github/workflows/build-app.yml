name: Build and Release app

on:
  push:
    branches: ["master"]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Setting up SSH keys for private repos
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.TFLIB_SSH_KEY }}
          ${{ secrets.TFHTTP_SSH_KEY }}

    - name: Init submodules
      run: git submodule update --init --recursive
      
    - name: Set up C++ build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
      
    - name: Build executable
      run: |
        cd backend
        mkdir out
        cd out
        cmake -DCMAKE_BUILD_TYPE=Release ../
        cmake --build .
    - name: Upload the executable as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: npcs_sim  # The name of the artifact (this will be the file you download later)
        path: ./backend/out/npcs_sim  # Path to the built executable
  release:
    runs-on: ubuntu-latest
    needs: build  # This ensures the build job runs first

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Setting up SSH keys for private repos
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.TFLIB_SSH_KEY }}
          ${{ secrets.TFHTTP_SSH_KEY }}

    - name: Init submodules
      run: git submodule update --init --recursive

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v0.0.0
        files: ./backend/out/npcs_sim  # Path to your executable
        prerelease: true

    - name: Publish release
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./backend/out/npcs_sim
        asset_name: npcs_sim
        asset_content_type: application/octet-stream
