name: Build, package, and upload the application

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/*'

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
    
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Setting up SSH keys for private repos
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.TFLIB_SSH_KEY }}
          ${{ secrets.TFHTTP_SSH_KEY }}



    - name: Init submodules
      run: git submodule update --init --recursive
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        sudo apt install npm
      
    - name: Build Backend and Run Tests
      run: |
        cd backend
        cmake --preset release
        cd out/release
        cmake --build .
        ./npcs_tests
        
    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm install -g @angular/cli
        ng build

    - name: Package App
      run: |
        mkdir -p package
        cp ./backend/out/release/npcshowdown package/
        cp -r ./frontend/dist/npcshowdown package/static
        cp deploy/* package/
        cd package
        tar -czvf ../npcs-latest.tar.gz ./static ./npcshowdown ./create-tables-prod.sql ./install_ubuntu.sh ./npcshowdown.conf ./npcshowdown.service ./deploy.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: npcs-latest.tar.gz
        path: ./npcs-latest.tar.gz