<div *ngIf="this.resultSet" class="tournament-result">
    <label class="horizontal-margin name">{{this.resultSetName()}}</label>
    <label class="horizontal-margin">{{resultSet.dateRan}}</label>
    <label class="horizontal-margin">{{resultSet.user ? resultSet.user : 'Anonymous'}}</label>
    <label class="horizontal-margin">{{resultSet.results.length}} trainers</label>
    <a class="horizontal-margin" style="margin-left: auto;" href="/results/{{resultSet.id}}">View Results</a>
    <button *ngIf="this.deleteable" class="horizontal-margin" (click)="this.openDeleteModal(resultSet.id)" class="delete-tournament-button"><img src="../../assets/delete.svg" width="30" height="30"></button>
</div>
