<div class="flex-container">
    <app-navbar></app-navbar>
    <div class="content">
        <router-outlet></router-outlet>
    </div>
    <app-footer></app-footer>
</div>
<div class="messages">
    <div (mouseenter)="this.stopHideCountdown()" (mouseleave)="this.startMessageHideCountdown()" [ngStyle]="{'background-color': this.color}" [@fade]="this.hideMessage ? 'hidden' : 'visible'" class="message">
        <label>{{currentMessage}}</label>
    </div>
</div>
