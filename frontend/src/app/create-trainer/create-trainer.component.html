<div class="create-trainer-container">
<button class="collapsible-header" (click)="toggleCollapsible()">
    <h2>Trainer {{trainerNum}}</h2>
    <div class="info" [hidden]="!this.collapsed">
        <div class="name">
            {{this.trainer.name}}
        </div>
        <div class="pokemon-count">
            {{this.trainer.team.length}}/6
        </div>
        <div class="level">
            {{this.trainer.trainerLevel}}
        </div>
    </div>
    <button (click)="this.removeSelf()" [hidden]="this.parent == undefined" class="remove-trainer-button">X</button>
</button>
<div class="import-save-buttons" [hidden]="this.collapsed">
    <button (click)="loadFromFile();">Import from File</button>
    <button [hidden]="this.app.loggedInUser == undefined">Import from My Trainers</button>
    <button (click)="download();">Save to File</button>
    <button [hidden]="this.app.loggedInUser == undefined">Save to My Trainers</button>
</div>
<div class="trainer-info" [hidden]="this.collapsed" #trainerInfo>
    <div class="trainer-name">
        <label>Trainer Name: </label>
        <input [(ngModel)]="this.trainer.name">
    </div>
    <div class="trainer-level">
        <label>Trainer AI Level: </label>
        <select [(ngModel)]="this.trainer.trainerLevel">
            <option *ngFor="let level of dataLists.trainerLevelList" value="{{level}}">{{level}}</option>
        </select>
    </div>
</div>
<div *ngFor="let poke of this.trainer.team; index as i"  class="pokemon-list" [hidden]="this.collapsed" #container>
    <app-create-pokemon [pokemon]="poke" [dataLists]="this.dataLists" [trainer]="this.trainer" [pokeNumber]="(i+1).toString()" [parent]="this" ></app-create-pokemon>
</div>
<button class="add-pokemon-button" [hidden]="this.trainer.team.length > 5 || this.collapsed" (click)="addPoke()">Add Pokemon</button>
</div>
