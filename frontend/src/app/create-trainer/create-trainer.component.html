<div class="create-trainer-container">
    <app-user-trainers-modal #trainerModal></app-user-trainers-modal>
    <div class="collapsible-header">
        <button class="collapse-button" (click)="toggleCollapsible()">{{this.collapseButtonSymbol}}</button>
        <label style="text-align: left;">Trainer {{trainerNum}}</label>
        <label>{{this.trainer.name}}</label>
        <label>{{this.trainer.team.length}}/6</label>
        <label>{{this.trainer.trainerLevel}}</label>
        
        <!-- These only show on the results view -->
        <label *ngIf="this.results">{{this.results!.elo}}</label>
        <label *ngIf="this.results">{{this.results!.wins}}</label>
        <label *ngIf="this.results">{{this.results!.losses}}</label>
        <label *ngIf="this.results">{{this.results!.losses > 0 ? (this.results!.wins / this.results!.losses).toFixed(2) : "Never lost!"}}</label>
        <button *ngIf="this.results" (click)="showBattle(this.resultsView!.results!.trainers[this.results.bestWin.trainer1Index], this.resultsView!.results!.trainers[this.results.bestWin.trainer2Index], this.results.bestWin.seed.toString())" class="best-win-button">{{this.results!.bestWinEloDiff > 0 ? "+" : ""}}{{this.results!.wins > 0 ? this.results!.bestWinEloDiff : "Never won!"}}</button>

        <!-- This only shows on the create tournament view -->
        <button (click)="this.removeSelf()" [hidden]="!(this.parentIsCreateTournament()) || this.readOnly" class="remove-trainer-button">X</button>

        <!-- These only show on the user trainers view -->
        <div [hidden]="!this.showEditButton" style="margin-left: auto;">
            <button (click)="this.edit()" [hidden]="!this.showEditButton || this.editing" class="edit-trainer-button"><img src="../../assets/edit.svg" width="30" height="30"></button>
            <button (click)="this.openDeleteModal()" [hidden]="!this.showEditButton || this.editing" class="delete-trainer-button"><img src="../../assets/delete.svg" width="30" height="30"></button>
        </div>
        <button (click)="this.updateTrainer()" [hidden]="!this.showEditButton || !this.editing" class="update-trainer-button">✓</button>
        <button (click)="this.revertChanges()" [hidden]="!this.showEditButton || !this.editing" class="undo-changes-button">X</button>
    </div>
    <div class="import-save-buttons" [hidden]="this.collapsed">
        <button (click)="loadFromFile();" [hidden]="this.readOnly">Import from File</button>
        <button (click)="this.showTrainerModal()" [hidden]="this.app.loggedInUser == undefined || this.readOnly">Import from My Trainers</button>
        <button (click)="download();">Save to File</button>
        <button (click)="saveToUserProfile()" [disabled]="this.trainerAdded" [hidden]="this.app.loggedInUser == undefined || !this.showAddMyTrainers">{{this.addTrainertext}}</button>
    </div>
    <div class="trainer-info" [hidden]="this.collapsed" #trainerInfo>
        <div class="trainer-name">
            <label>Name: </label>
            <input [(ngModel)]="this.trainer.name" [readonly]="this.readOnly">
        </div>
        <div class="trainer-level">
            <label>AI Level: </label>
            <select [(ngModel)]="this.trainer.trainerLevel" [disabled]="this.readOnly">
                <option *ngFor="let level of dataLists?.trainerLevelList" value="{{level}}">{{level}}</option>
            </select>
        </div>
    </div>
    <div [hidden]="this.collapsed" class="pokemon-block">
        <div class="pokemon-tabs">
            <button [style.background-color]="(this.selectedIndex == i) ? 'rgb(105, 105, 106)' : ''" (click)="this.setSelectedIndex(i)" *ngFor="let pokemon of trainer.team; index as i" class="pokemon-tab">
                <span class="pokemon-label"><img *ngIf="this.imageStrings[i] != ''" src="../../assets/box_sprites/{{this.imageStrings[i]}}.png" width="34" height="28"> {{pokemon.nickname === "" ? pokemon.species : pokemon.nickname}}</span>
                <button *ngIf="!this.readOnly" (click)="this.removePoke(i)" class="remove-pokemon-btn">X</button>
            </button>
            <button (click)="this.addPoke()" [hidden]="this.trainer.team.length > 5 || this.readOnly" class="add-pokemon-btn">
                + Add Pokemon
            </button>
        </div>
        <div *ngIf="this.trainer.team.length > 0" class="pokemon-details">
            <div style="margin-left: 10px;" class="pokemon-column">
                <div class="pokemon-input">
                    <div class="inline-label">Species: </div> <input type="text" list="speciesList" (focusout)="this.autoCompleteSpecies($event)" [(ngModel)]="this.trainer.team[selectedIndex].species" [readOnly]="this.readOnly">
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Ability: </div> <input type="text" list="abilityList" (focusout)="this.autoCompleteAbility($event)" [(ngModel)]="this.trainer.team[selectedIndex].abilityName" [readOnly]="this.readOnly">
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Item: </div> <input type="text" list="itemList" (focusout)="this.autoCompleteItem($event)" [(ngModel)]="this.trainer.team[selectedIndex].itemName" [readOnly]="this.readOnly">
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Level: </div> <input type="number" min="0" max="100" [(ngModel)]="this.trainer.team[selectedIndex].level" [readOnly]="this.readOnly">
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Gender: </div>
                    <select [(ngModel)]="this.trainer.team[selectedIndex].gender" [disabled]="this.readOnly">
                        <option value="Random">Random</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Nickname: </div> <input type="text" [(ngModel)]="this.trainer.team[selectedIndex].nickname" [readOnly]="this.readOnly">
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Nature: </div>
                    <select [(ngModel)]="this.trainer.team[selectedIndex].nature" [disabled]="this.readOnly">
                        <option *ngFor="let nature of dataLists?.natureList" value="{{nature}}">{{nature}}</option>
                    </select>
                </div>
            </div>
            <div style="float: right; margin-right: 10px;" class="pokemon-column">
                <div class="pokemon-input">
                    <div class="inline-label">Move 1: </div> <input type="text" list="moveList" (focusout)="this.autoCompleteMove($event, 0)" [(ngModel)]="this.trainer.team[selectedIndex].moves[0]" [readOnly]="this.readOnly">
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Move 2: </div> <input type="text" list="moveList" (focusout)="this.autoCompleteMove($event, 1)" [(ngModel)]="this.trainer.team[selectedIndex].moves[1]" [readOnly]="this.readOnly">
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Move 3: </div> <input type="text" list="moveList" (focusout)="this.autoCompleteMove($event, 2)" [(ngModel)]="this.trainer.team[selectedIndex].moves[2]" [readOnly]="this.readOnly">
                </div>
                <div class="pokemon-input">
                    <div class="inline-label">Move 4: </div> <input type="text" list="moveList" (focusout)="this.autoCompleteMove($event, 3)" [(ngModel)]="this.trainer.team[selectedIndex].moves[3]" [readOnly]="this.readOnly">
                </div>
                <div class="stat-value-input">
                    <div class="inline-label"></div>
                    <span class="stat-label">HP</span>
                    <span class="stat-label">ATK</span>
                    <span class="stat-label">DEF</span>
                    <span class="stat-label">SPA</span>
                    <span class="stat-label">SPD</span>
                    <span class="stat-label">SPE</span>
                </div>
                <div class="stat-value-input">
                    <div class="inline-label">
                        EVs: 
                    </div>
                    <input placeholder="HP" type="number" min="0" max="255"  [(ngModel)]="this.trainer.team[selectedIndex].evs[0]" [readOnly]="this.readOnly">
                    <input placeholder="ATK" type="number" min="0" max="255" [(ngModel)]="this.trainer.team[selectedIndex].evs[1]" [readOnly]="this.readOnly">
                    <input placeholder="DEF" type="number" min="0" max="255" [(ngModel)]="this.trainer.team[selectedIndex].evs[2]" [readOnly]="this.readOnly">
                    <input placeholder="SPA" type="number" min="0" max="255" [(ngModel)]="this.trainer.team[selectedIndex].evs[3]" [readOnly]="this.readOnly">
                    <input placeholder="SPD" type="number" min="0" max="255" [(ngModel)]="this.trainer.team[selectedIndex].evs[4]" [readOnly]="this.readOnly">
                    <input placeholder="SPE" type="number" min="0" max="255" [(ngModel)]="this.trainer.team[selectedIndex].evs[5]" [readOnly]="this.readOnly">
                </div>
                <div class="stat-value-input">
                    <div class="inline-label">
                        IVs: 
                    </div>
                    <input placeholder="HP" type="number" min="0" max="31" [(ngModel)]="this.trainer.team[selectedIndex].ivs[0]" [readOnly]="this.readOnly">
                    <input placeholder="ATK" type="number" min="0" max="31" [(ngModel)]="this.trainer.team[selectedIndex].ivs[1]" [readOnly]="this.readOnly">
                    <input placeholder="DEF" type="number" min="0" max="31" [(ngModel)]="this.trainer.team[selectedIndex].ivs[2]" [readOnly]="this.readOnly">
                    <input placeholder="SPA" type="number" min="0" max="31" [(ngModel)]="this.trainer.team[selectedIndex].ivs[3]" [readOnly]="this.readOnly">
                    <input placeholder="SPD" type="number" min="0" max="31" [(ngModel)]="this.trainer.team[selectedIndex].ivs[4]" [readOnly]="this.readOnly">
                    <input placeholder="SPE" type="number" min="0" max="31" [(ngModel)]="this.trainer.team[selectedIndex].ivs[5]" [readOnly]="this.readOnly">
                </div>
            </div>
        </div>
    </div>
</div>

<div [hidden]="!this.showDeleteModal" id="modal-background" (mousedown)="this.closeDeleteModal($event)"   class="modal-background">
    <div [hidden]="!this.showDeleteModal" class="modal-content" (mousedown)="$event.stopPropagation()">
        <h3>Are you absolutely sure you want to delete <b>{{this.trainer.name}}</b> from your profile? <br>This can't be undone.</h3>
        <div class="confirm-buttons">
            <button style="margin-right: 40px; background-color: rgb(0,255,0);" class="confirm-button" (click)="this.deleteFromProfile()">Yes, get rid of 'em!</button>
            <button style="margin-left:  40px; background-color: rgb(255,0,0);" class="confirm-button" (click)="this.closeDeleteModal($event)">No wait! Keep them!</button>
        </div>
    </div>
</div>
