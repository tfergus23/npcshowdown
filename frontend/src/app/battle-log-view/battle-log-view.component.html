<div *ngIf="!this.hidden" class="container">
    <div class="header">
        <h1>Battle Log</h1>
        <button (click)="this.hide()">X</button>
    </div>
    <hr>
    <textarea readonly="true">{{this.log}}</textarea>
    <div class="save-buttons">
        <button (click)="this.download()">Save Battle to File</button>
    </div>
</div>
