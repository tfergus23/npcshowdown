<div class="container">
    <h1>Showing results for tournament #{{this.tournamentID}}</h1>
    <div class="save-download-buttons">
        <button *ngIf="this.results">Save To File</button><button *ngIf="this.results && this.app.loggedInUser && this.app.loggedInUser.tournaments" (click)="this.addTournamentToUser()" [disabled]="this.userHasTournament()">{{this.userHasTournament() ? "Saved ✓" : "Add to My Tournaments"}}</button>
    </div>
    <p *ngIf="this.results && this.results.user">Submitted by user <span class="bold">{{this.results.user}}</span></p>
    <p *ngIf="this.results && !this.results.user">Submitted by an anonymous user</p>
    <p *ngIf="this.results">Click on the column headers to sort the list. You can also click the numbers in the best win column to view the battles.</p>
    <div *ngIf="this.results" class="result-column-headers">
        <button (click)="sortByTrainerNumber()" style="text-align: left;">Trainer #</button>
        <button (click)="sortByName()">Name</button>
        <button (click)="sortByPokemonCount()"># Pokemon</button>
        <button (click)="sortByTrainerLevel()">Level</button>
        <button (click)="sortByELO()">ELO</button>
        <button (click)="sortByWins()">Wins</button>
        <button (click)="sortByLosses()">Losses</button>
        <button (click)="sortByWLRatio()">Ratio</button>
        <button (click)="sortByBestWin()">Best Win</button>
    </div>
    <div *ngIf="this.results" class="trainer-list-container">
        <div *ngFor="let result of results.results; index as i" class="tournament-trainer-list">
            <app-create-trainer [resultsView]="this" [collapsed]="true" [results]="result" [dataLists]="this.dataLists" [readOnly]="true" [trainer]="this.results.trainers[result.index]" [trainerNum]="(result.index+1).toString()"></app-create-trainer>
        </div>
    </div>
    <div *ngIf="!this.results">
        {{this.errorMessage}}
    </div>
</div>
<app-battle-log-view #logView></app-battle-log-view>
