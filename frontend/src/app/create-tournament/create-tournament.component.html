<app-data-lists [dataLists]="this.dataLists"></app-data-lists>
<app-user-trainers-modal [parent]="this" [selectMultiple]="true" #trainerModal></app-user-trainers-modal>
<div class="container">
    <h1>Create a Tournament</h1>
    <h2>Trainers</h2>
    <div class="add-buttons">
        <button [disabled]="this.importingTrainers" (click)="addEmptyTrainer()">Add New</button>
        <button [disabled]="this.importingTrainers" (click)="addFromFiles()">Add From File</button>
        <button (click)="this.openTrainersModal()" [hidden]="this.app.loggedInUser == undefined">Add From My Trainers</button>
    </div>
    <div *ngFor="let trainer of trainers; index as i" class="tournament-trainer-list">
        <app-create-trainer [onEdit]="this.saveEntries" [collapsed]="true" [dataLists]="this.dataLists" [parent]="this" [trainer]="trainer" [trainerNum]="(i+1).toString()"></app-create-trainer>
    </div>
    <div class="seed-field">
        <label class="seed-label">Rounds:</label>
        <input (focusout)="this.saveEntries()" [(ngModel)]="rounds" class="seed-input" type="number">
    </div>
    <div class="seed-field">
        <label class="seed-label">Name (Optional):</label>
        <input (focusout)="this.saveEntries()" [(ngModel)]="name" class="seed-input">
    </div>
    <div class="seed-field">
        <label class="seed-label">Seed (Optional):</label>
        <input (focusout)="this.saveEntries()" [(ngModel)]="seed" class="seed-input">
    </div>
    <app-error-box [errors]="this.errors"></app-error-box>
    <app-spinning-button [disabled]="this.numBattles() >20000 || this.importingTrainers"  [loadWhile]="this.whileSubmittingTournament" [click]="this.submitTournament" [text]="this.submitText()"></app-spinning-button>
</div>
