<div class="profile-content">
    <h2>{{this.app.loggedInUser?.name}}'s Tournaments</h2>
    <hr>
    <div class="info-container">
        <app-results-info [hidden]="this.resultSets.length <= 0" *ngFor="let resultSet of this.resultSets; index as i" [resultSet]="resultSet" [parent]="this" [deleteable]="true"  class="tournament-result"></app-results-info>
    </div>
    <div style="margin: 50px;" [hidden]="this.resultSets.length > 0 || this.fetchingTournaments">You have no tournaments lol</div>
    <app-spinner *ngIf="this.fetchingTournaments" [size]="'30px'"></app-spinner>
</div>
<div [hidden]="!this.showDeleteModal" id="modal-background" (mousedown)="this.closeDeleteModal()"   class="modal-background">
    <div [hidden]="!this.showDeleteModal" class="modal-content" (mousedown)="$event.stopPropagation()">
        <h3>Are you sure you want to delete this tournament from your profile? If no one else has this tournament saved, it will be deleted in a week. You will still be able to view, download, and re-add the tournament in this time.</h3>
        <div class="confirm-buttons">
            <button style="margin-right: 40px; background-color: rgb(0,255,0);" class="confirm-button" (click)="this.deleteSelectedTournamentFromProfile()">Yes please.</button>
            <button style="margin-left:  40px; background-color: rgb(255,0,0);" class="confirm-button" (click)="this.closeDeleteModal()">No wait!</button>
        </div>
    </div>
</div>
